seed: 42
final_seeds: [42, 1337, 2026]
num_classes: 20
default_tier: "t1"
require_torch: true
detector_version: "md6-apa-rtdetr-e@apache2.0"
crop_version: "crop-v1"
split_version: "split_v2"

gates:
  macro_f1_min: 0.90
  hard_pair_classes: ["M08", "M09", "B03", "B04", "B05"]
  hard_pair_recall_min: 0.80
  per_class_recall_floor: 0.70
  min_escalation_gain: 0.015

tiers:
  t0:
    backbone: "hf-hub:imageomics/bioclip-2"
    architecture: "ViT-L/14"
    license: "MIT"
    input_size: 224
    embedding_dim: 768
    prompt_templates:
      - "a photo of {scientific_name}, {common_name}"
      - "a wildlife photo of a {common_name} ({scientific_name})"
      - "an image of the animal {common_name}, {scientific_name}"

  t1:
    backbone: "hf-hub:imageomics/bioclip-2"
    input_size: 224
    embedding_dim: 768
    train_views_per_crop: 4
    eval_views_per_crop: 1
    logistic_regression_c_grid: [0.1, 0.3, 1.0, 3.0, 10.0]
    group_kfold_splits: 5
    class_weight: "balanced"
    mlp_fallback:
      hidden_dim: 512
      dropout: 0.20
      lr: 0.001
      epochs: 30
      patience: 5

  t2:
    backbone: "hf-hub:imageomics/bioclip-2"
    input_size: 224
    unfreeze_last_blocks: 4
    epochs: 8
    patience: 3
    top_lr: 0.00001
    layer_decay: 0.75
    head_lr: 0.0005
    weight_decay: 0.05
    batch_size: 32
    grad_accum_steps: 4
    label_smoothing: 0.05

  t3:
    backbone: "tf_efficientnetv2_s.in21k_ft_in1k"
    license: "Apache-2.0"
    input_size: 384
    head_epochs: 3
    head_lr: 0.001
    finetune_epochs: 20
    patience: 4
    backbone_lr: 0.00003
    weight_decay: 0.0001
    batch_size: 64
    label_smoothing: 0.05

  distill:
    student_backbone: "tf_efficientnetv2_s.in21k_ft_in1k"
    input_size: 384
    epochs: 15
    temperature: 2.0
    kl_weight: 0.50
    ce_weight: 0.50
    cpu_p95_latency_threshold_ms: 400.0
