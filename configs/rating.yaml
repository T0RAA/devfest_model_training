model_version: "species-v2.0"
detector_version: "md6-apa-rtdetr-e@apache2.0"
crop_version: "crop-v1"
calibration_version: "temp-v2"
rating_version: "quality-v2"
argon_model_version: "gemini-4-argon"

# Photographic Quality Rubric Weights (computed on the detector crop; must sum to 1.0)
quality_weights:
  sharpness: 0.30
  visibility: 0.25
  exposure: 0.15
  resolution: 0.15
  composition: 0.15

# Feature calibration anchors (0-100 normalization parameters)
feature_calibration:
  sharpness_laplacian_low: 15.0
  sharpness_laplacian_high: 450.0
  resolution_min_side_px: 64
  resolution_ideal_side_px: 512
  exposure_ideal_mean: 122.0
  exposure_clip_penalty_weight: 180.0
  edge_margin_fraction: 0.06

# Composite Identification-Ready Rating R = round(0.65 * Q + 0.35 * (100 * C))
composite_weights:
  quality: 0.65
  confidence: 0.35

# Unknown-species / Out-of-Distribution Rejection Gate (tuned in Milestone 10, §8.2)
acceptance_gate:
  max_prob_threshold: 0.78
  margin_threshold: 0.15
  energy_threshold: -1.20
  coarse_group_agreement_min_sum: 0.75
  false_accept_rate_target: 0.05
  tau_det: 0.25
  owlv2_uncertain_margin: 0.10
